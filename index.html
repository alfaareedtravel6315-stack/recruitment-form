<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recruitment Inquiry Form</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="recruitment-form-section">

        <div class="form-container">

            <!-- Form Header -->
            <header class="form-header">
                <h1>Recruitment Inquiry Form</h1>

                <p>
                    Submit your details and our team will get in touch with you shortly.
                </p>
            </header>


            <!-- Recruitment Form -->
            <form id="recruitmentForm" novalidate>

                <div class="row form-grid">

                    <!-- Name -->
                    <div class="col-12 col-md-6 form-field">
                        <label for="name">Name</label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            autocomplete="name"
                            required
                        >
                    </div>


                    <!-- Phone Number -->
                    <div class="col-12 col-md-6 form-field">
                        <label for="phone">Phone Number</label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            autocomplete="tel"
                            required
                        >
                    </div>


                    <!-- Current Location -->
                    <div class="col-12 col-md-6 form-field">
                        <label for="location">Current Location</label>

                        <input
                            type="text"
                            id="location"
                            name="location"
                            autocomplete="address-level2"
                            required
                        >
                    </div>


                    <!-- Subject -->
                    <div class="col-12 col-md-6 form-field">
                        <label for="subject">Subject</label>

                        <input
                            type="text"
                            id="subject"
                            name="subject"
                            required
                        >
                    </div>


                    <!-- Message -->
                    <div class="col-12 form-field form-field-full">
                        <label for="message">Message</label>

                        <textarea
                            id="message"
                            name="message"
                            rows="7"
                        ></textarea>
                    </div>

                </div>


                <!-- Send Message Button -->
                <div class="form-action">
                    <button type="submit">
                        Send Message
                    </button>
                </div>

            </form>

        </div>

    </main>


    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Custom JavaScript -->
    <script src="script.js"></script>

</body>
</html>
